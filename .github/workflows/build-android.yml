name: Build Android APK (Cosmic Runner 3D)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: unity-build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buildAndroid:
    name: Build Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build Unity Android Player (APK)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: Android
          buildName: CosmicRunner3D
          buildsPath: build/Android
          androidExportType: 'androidPackage'
          androidKeystoreName: 'user.keystore'
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmicRunner3D-Android-APK
          path: build/Android/Android.apk
          if-no-files-found: error
